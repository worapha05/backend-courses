services:
  postgres:
    image: postgres:16-alpine
    container_name: express-bootcamp-db
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: express_bootcamp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bootcamp -d express_bootcamp']
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
